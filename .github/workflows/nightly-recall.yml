name: Nightly recall gate

# ADR-0016 / PRINCIPLE-001（DECISION-CI-RECALL 選択肢C）:
# 「見逃し0＝recall 100%」を*リリースゲート*として担保する。実 scanner の recall は
# 実ブラウザ E2E が要るため、PR ごとの CI（apt mirror 403 で不安定＝非 blocking のまま）に
# は載せず、**定期実行の専用 job を blocking** で回す。recall 回帰は nightly で確実に検出する。
on:
  schedule:
    - cron: '0 18 * * *'   # 毎日 18:00 UTC
  workflow_dispatch:        # 手動実行も可

jobs:
  e2e-recall:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      # apt mirror(packages.microsoft.com) の断続 403 対策に軽いリトライを噛ませる。
      # nightly は PR を塞がないため、恒久失敗時はこの job のみ赤くなる（PR CI は無関係）。
      - name: Install Chromium for Playwright
        run: |
          for i in 1 2 3; do
            playwright install --with-deps chromium && break
            echo "playwright install failed (attempt $i); retrying..." && sleep 15
          done

      # blocking: recall ゲート（test_recall_gate_is_100_percent 他）を含む E2E を実走する。
      - name: End-to-end recall gate (blocking)
        env:
          WSCAN_E2E: '1'
        run: pytest -q tests/test_end_to_end_scan.py
